name: Controls checks

on:
  pull_request:
    paths:
      - 'src/core/Input.js'
      - 'src/App.js'
      - 'src/game/Guide.js'
      - 'src/ui/UI.js'
      - 'src/world/ThirdIslandSystem.js'
      - 'test/cursor-look.mjs'
      - 'test/helicopter*.mjs'
      - 'package*.json'
      - '.github/workflows/controls-checks.yml'

permissions:
  contents: read

jobs:
  controls:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Input and helicopter tests
        run: npm run test:input
      - name: Network tests
        run: npm run test:network
      - name: Publication checks
        run: npm run test:publication
      - name: Build
        run: npm run build
